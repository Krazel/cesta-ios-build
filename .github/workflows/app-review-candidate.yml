name: Upload Cesta App Review candidate (no submission)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-26
    environment: app-store-production
    timeout-minutes: 45
    env:
      CESTA_DISTRIBUTION: testflight
      CESTA_RELEASE_CONFIG: store/app-review.json
      CESTA_ADS_MODE: production
      EXPO_PUBLIC_API_URL: https://cesta.krazel-zodiac-daily.workers.dev
      EXPO_PUBLIC_SHARE_URL: https://cesta.krazel-zodiac-daily.workers.dev
      EXPO_NO_TELEMETRY: '1'
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/promptPolicy.test.mjs tests/purchases.test.mjs tests/textImport.test.mjs tests/syncEngine.test.mjs
      - name: Archive, sign, validate and upload only
        run: node scripts/build-testflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cesta-1.5.1-build3-AppReview
          path: |
            artifacts/Cesta-1.5.1-build3-AppReview.ipa
            artifacts/testflight-build.json
          retention-days: 1
          if-no-files-found: ignore
