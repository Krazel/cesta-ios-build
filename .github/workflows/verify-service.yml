name: Verify public Cesta service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public health endpoint (no personal data)
        run: |
          curl --fail --show-error --silent --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 5 https://cesta.krazel-zodiac-daily.workers.dev/api/health -o health.json
          node -e "const h=require('./health.json'); if(h.ok!==true||h.protocol!==2)process.exit(1);console.log(JSON.stringify(h))"
      - uses: actions/upload-artifact@v4
        with:
          name: Cesta-public-health
          path: health.json
          retention-days: 1
